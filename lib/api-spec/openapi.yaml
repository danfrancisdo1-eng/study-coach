openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: coach
    description: Study coaching operations
  - name: study
    description: Authenticated, owner-scoped study sessions
paths:
  /coach/analyze:
    post:
      operationId: analyzeMaterial
      tags: [coach]
      summary: Extract course topics and dated requirements from material
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeInput"
      responses:
        "200":
          description: Extracted items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeResult"
  /coach/quiz:
    post:
      operationId: generateQuiz
      tags: [coach]
      summary: Generate a grounded practice quiz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizInput"
      responses:
        "200":
          description: Practice questions with hidden answer keys for client-side grading
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResult"
  /coach/transcribe:
    post:
      operationId: transcribeLecture
      tags: [coach]
      summary: Transcribe audio explicitly sent by the student; no server-side audio storage
      parameters:
        - in: header
          name: X-Audio-Type
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Timestamped audio passages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptResult"
  /coach/plan:
    post:
      operationId: generateExamPlan
      tags: [coach]
      summary: Generate a multi-day exam preparation plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanInput"
      responses:
        "200":
          description: Exam preparation sequence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResult"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /study/state:
    get:
      operationId: getStudyState
      tags: [study]
      summary: Get the authenticated account's saved study state and version
      responses:
        "200":
          description: Study state, or null when not initialized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyStateEnvelope" }
    put:
      operationId: putStudyState
      tags: [study]
      summary: Replace study state using version compare-and-swap
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudyStateUpdate" }
      responses:
        "200":
          description: Updated state and version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyStateEnvelope" }
        "409": { description: Version mismatch }
  /study/courses/{courseId}/exam-guide:
    parameters:
      - { name: courseId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
    post:
      operationId: lookupExamGuide
      tags: [study]
      summary: Look up the official exam guide (sections and weights) for a certification exam with web search and save it on the exam
      description: Requires persisted state.aiConsent=true. Only the exam's name is sent to the AI provider's web search. Replaces any previously saved guide.
      responses:
        "200":
          description: The saved guide (found may be false)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExamGuide" }
        "400": { description: Not a certification exam }
        "403": { description: Explicit persisted AI consent required }
        "404": { description: Course not found }
        "502": { description: The lookup failed; nothing was saved }
  /study/courses/{courseId}:
    parameters:
      - { name: courseId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
    delete:
      operationId: deleteCourse
      tags: [study]
      summary: Permanently delete one course and everything saved for it
      description: Removes the course, its saved materials, its study sessions and their review items, and its lectures and transcripts, in one transaction. Other courses and accounts are untouched.
      responses:
        "200":
          description: Course deleted; the updated study state is returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseDeletion" }
        "404": { description: Course not found in this account }
        "409": { description: Study state kept changing; retry }
  /study/import:
    post:
      operationId: importStudyState
      tags: [study]
      summary: Import state only when the account has no saved state
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudyStateImport" }
      responses:
        "201":
          description: Imported state and version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyStateEnvelope" }
        "409": { description: State already exists }
  /study/materials/website:
    post:
      operationId: extractStudyWebsite
      tags: [study]
      summary: Read one public website page without crawling
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudyWebsiteInput" }
      responses:
        "200":
          description: Text preview only; not saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyMaterialExtraction" }
        "422":
          description: Page unavailable or unsafe to read
  /study/sessions:
    get:
      operationId: listStudySessions
      tags: [study]
      summary: List the authenticated account's session summaries
      responses:
        "200":
          description: Session summaries
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/StudySessionSummary" }
    post:
      operationId: createStudySession
      tags: [study]
      summary: Create a persistent focused study session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudySessionInput" }
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudySession" }
  /study/materials/extract:
    post:
      operationId: extractStudyMaterial
      tags: [study]
      summary: Transiently extract text from an authenticated upload
      description: Requires Clerk authentication. Uploads are processed in memory only and are never persisted or logged. Maximum upload is 12 MiB and extraction has a 10-second processing budget. Extracted text is limited to 100,000 characters without truncation. ZIP documents are limited to 2,000 entries and 40 MB cumulative actual uncompressed size, with relevant XML entries limited to 10 MB. DOCX is limited to 100 sections, 50,000 paragraphs, and 100,000 text runs; PPTX is limited to 500 slides, 50,000 paragraphs, and 100,000 text runs; PDF is limited to 500 pages and 50,000 text items. Images and scanned PDF text are not OCR processed.
      parameters:
        - in: header
          name: X-Filename
          required: true
          schema: { type: string, minLength: 1, maxLength: 1024 }
          description: Original filename; the server sanitizes it and uses its extension when needed to identify the format.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
          text/plain:
            schema: { type: string, format: binary }
          text/markdown:
            schema: { type: string, format: binary }
          application/pdf:
            schema: { type: string, format: binary }
          application/vnd.openxmlformats-officedocument.wordprocessingml.document:
            schema: { type: string, format: binary }
          application/vnd.openxmlformats-officedocument.presentationml.presentation:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Extracted text and explicit extraction coverage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyMaterialExtraction" }
        "400": { description: Missing filename or empty upload }
        "401": { description: Authentication required }
        "413": { description: Upload exceeds 12 MiB }
        "415": { description: Unsupported or mismatched media type }
        "422": { description: "Supported file could not be read, contained no readable text, or exceeded extraction limits" }
  /study/sessions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getStudySession
      tags: [study]
      summary: Get a session without private answer keys
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudySession" }
        "404": { description: Session not found }
  /study/lectures:
    get:
      operationId: listLectures
      tags: [study]
      summary: List the signed-in account's lectures (without transcripts), newest first
      parameters:
        - { name: courseId, in: query, required: false, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: Lecture summaries
          content:
            application/json:
              schema:
                type: object
                required: [lectures]
                properties:
                  lectures:
                    type: array
                    items: { $ref: "#/components/schemas/LectureSummary" }
    post:
      operationId: createLecture
      tags: [study]
      summary: Register a lecture recorded or imported on the device. Audio is not uploaded here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LectureInput" }
      responses:
        "201":
          description: Created lecture
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lecture" }
        "400": { description: Invalid input or unknown course }
  /study/lectures/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getLecture
      tags: [study]
      summary: Get one lecture with its transcript
      responses:
        "200":
          description: Lecture
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lecture" }
        "404": { description: Lecture not found }
    put:
      operationId: updateLecture
      tags: [study]
      summary: Update title, transcript or status. Fails with 409 if the lecture changed since the given version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LectureUpdate" }
      responses:
        "200":
          description: Updated lecture
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lecture" }
        "400": { description: Invalid input }
        "404": { description: Lecture not found }
        "409": { description: Lecture changed on another device }
    delete:
      operationId: deleteLecture
      tags: [study]
      summary: Permanently delete a lecture and its transcript
      responses:
        "204": { description: Deleted }
        "404": { description: Lecture not found }
  /study/chat:
    get:
      operationId: getHomeChat
      tags: [study]
      summary: The chat-first home conversation for the signed-in account (SPEC §7); one thread per course or exam
      parameters:
        - { name: courseId, in: query, required: false, schema: { type: string, maxLength: 200 }, description: "The course or exam whose thread to return; omitted or unknown = the account's general thread." }
      responses:
        "200":
          description: Conversation so far (empty for a new account)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeChat" }
    post:
      operationId: sendHomeChatMessage
      tags: [study]
      summary: Send a message to the coach; it may create a course or start a study session
      description: Requires persisted state.aiConsent=true. Actions the coach took are listed on the assistant message.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HomeChatInput" }
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeChat" }
        "400": { description: Invalid message }
        "403": { description: Explicit persisted AI consent required }
        "409": { description: Conversation changed on another device; reload }
        "502": { description: The coach did not answer; nothing was changed }
  /study/chat/open:
    post:
      operationId: openHomeChat
      tags: [study]
      summary: Called when the app opens. Starts a new session in the chat (a check-in greeting with chips) when the last activity is older than the session gap; otherwise returns the chat unchanged.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HomeChatOpenInput" }
      responses:
        "200":
          description: Conversation, possibly with a new session greeting appended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeChat" }
  /study/sessions/{id}/check-in:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: checkInStudySession
      tags: [study]
      summary: Record an optional session check-in or skip
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudyCheckIn" }
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudySession" }
  /study/sessions/{id}/messages:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: sendStudyMessage
      tags: [study]
      summary: Add a multi-turn AI coaching message
      description: Requires persisted state.aiConsent=true. Source material is chunk-selected and responses include coverage/truncation status.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudyMessageInput" }
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudySession" }
        "403": { description: Explicit persisted AI consent required }
  /study/sessions/{id}/quiz:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: generateStudyQuiz
      tags: [study]
      summary: Generate a diagnostic or fresh targeted retest
      description: Requires persisted state.aiConsent=true; answer keys remain server-private.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudyQuizInput" }
      responses:
        "200":
          description: Updated session with public question data only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudySession" }
        "403": { description: Explicit persisted AI consent required }
        "502":
          description: Quiz generation failed; invalid item count is included when the model returned no usable questions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyQuizGenerationError" }
  /study/sessions/{id}/answers:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: saveStudyAnswer
      tags: [study]
      summary: Save or replace an answer using stable question and option identifiers
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudyAnswerInput" }
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudySession" }
        "400": { description: Unknown question or option }
  /study/sessions/{id}/questions/{questionId}/flag:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: questionId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: flagStudyQuestion
      tags: [study]
      summary: Report a question (wrong answer or unclear) and re-check its key
      description: Records the learner's report, then an independent model answers the question cold (without the key) and the verdict is stored on the question's flag. A question whose key is confirmed still counts; one whose key is wrong or unclear is excluded from the score, and a graded score is recomputed. Accepted before or after grading. Idempotent for the same kind and reason.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudyQuestionFlagInput" }
      responses:
        "200":
          description: Updated session; private answer keys remain hidden until grading
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudySession" }
        "400": { description: Invalid flag or question identifier }
        "401": { description: Authentication required }
        "404": { description: Session or question not found }
        "409": { description: "No quiz, or concurrent session update" }
  /study/sessions/{id}/flashcards/{cardId}/review:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: cardId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: reviewFlashcard
      tags: [study]
      summary: Record "got it" or "again" for one flashcard; completing the deck schedules review items
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlashcardReviewInput" }
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudySession" }
        "404": { description: Session or card not found }
        "409": { description: "No deck, or the session changed on another device" }
  /study/sessions/{id}/grade:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: gradeStudyQuiz
      tags: [study]
      summary: Idempotently grade answered valid questions and schedule review
      responses:
        "200":
          description: Updated session with score and report text
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudySession" }
components:
  schemas:
    StudyState:
      type: object
      description: "Account-owned JSON study state. AI actions require aiConsent true persisted here. Dates should be explicitly confirmed by the student (confirmed: true)."
      required: [aiConsent]
      properties:
        aiConsent: { type: boolean }
        courses: { type: array, items: { type: object, additionalProperties: true } }
        materials: { type: array, items: { type: object, additionalProperties: true } }
        topics: { type: object, additionalProperties: true }
        deadlines: { type: array, items: { type: object, additionalProperties: true } }
        concepts: { type: array, items: { type: object, additionalProperties: true } }
        reviewSchedule: { type: array, items: { type: object, additionalProperties: true } }
      additionalProperties: true
    StudyStateEnvelope:
      type: object
      required: [state, version]
      properties:
        state: { oneOf: [{ $ref: "#/components/schemas/StudyState" }, { type: "null" }] }
        version: { type: integer, minimum: 0 }
    CourseDeletion:
      type: object
      required: [state, version, deleted]
      properties:
        state: { $ref: "#/components/schemas/StudyState" }
        version: { type: integer, minimum: 1 }
        deleted:
          type: object
          required: [materials, sessions, reviewItems, lectures]
          properties:
            materials: { type: integer }
            sessions: { type: integer }
            reviewItems: { type: integer }
            lectures: { type: integer }
    StudyStateUpdate:
      type: object
      required: [state, version]
      properties:
        state: { $ref: "#/components/schemas/StudyState" }
        version: { type: integer, minimum: 0 }
    StudyStateImport:
      type: object
      required: [state]
      properties:
        state: { $ref: "#/components/schemas/StudyState" }
    StudySessionInput:
      type: object
      required: [courseId, topic, minutes]
      properties:
        courseId: { type: string, minLength: 1 }
        topic: { type: string, minLength: 1, maxLength: 300 }
        minutes: { type: integer, minimum: 1, maximum: 360 }
    StudySessionSummary:
      type: object
      required: [id, courseId, topic, minutes, createdAt, status]
      properties:
        id: { type: string, format: uuid }
        courseId: { type: string }
        topic: { type: string }
        minutes: { type: integer }
        createdAt: { type: string, format: date-time }
        status: { type: string, enum: [active, completed] }
        diagnosticScore: { type: ["number", "null"] }
        targetedScore: { type: ["number", "null"] }
        missedConcepts: { type: array, items: { type: string }, description: "Concepts missed in the latest graded attempt (D-042)" }
    StudyWebsiteInput:
      type: object
      required: [url]
      properties:
        url: { type: string, maxLength: 2048 }
    StudyMaterialExtraction:
      type: object
      required: [filename, format, text, status, coverage, characterCount, coverageNote]
      properties:
        filename: { type: string }
        format: { type: string, enum: [txt, md, pdf, docx, pptx, image, website] }
        sourceUrl: { type: string }
        text: { type: string }
        status: { type: string, enum: [complete] }
        coverage: { type: string, enum: [entire_file, selectable_text_only, document_body_text, slide_text_only, visible_image_text, public_page_text] }
        characterCount: { type: integer, minimum: 1, maximum: 100000 }
        coverageNote: { type: string }
    StudySession:
      type: object
      description: Public session payload. Never includes correct option IDs, answer indices, or grading keys.
      required: [id, courseId, topic, minutes, createdAt, status, checkIn, messages, quiz, attempts, scores, reviewSchedule, reportText]
      properties:
        id: { type: string, format: uuid }
        courseId: { type: string }
        topic: { type: string }
        minutes: { type: integer }
        createdAt: { type: string, format: date-time }
        status: { type: string, enum: [active, completed] }
        checkIn:
          oneOf: [{ $ref: "#/components/schemas/StudyCheckInResult" }, { type: "null" }]
        messages:
          type: array
          items:
            type: object
            required: [role, content, createdAt]
            properties:
              role: { type: string, enum: [user, assistant] }
              content: { type: string }
              createdAt: { type: string, format: date-time }
              sourceStatus: { $ref: "#/components/schemas/StudySourceStatus" }
        quiz:
          oneOf: [{ $ref: "#/components/schemas/StudyQuiz" }, { type: "null" }]
        attempts:
          type: array
          description: Completed diagnostic and retest attempts, including post-grade question feedback.
          items: { $ref: "#/components/schemas/StudyQuiz" }
        scores:
          type: object
          required: [diagnostic, targeted]
          properties:
            diagnostic: { oneOf: [{ $ref: "#/components/schemas/StudyScore" }, { type: "null" }] }
            targeted: { oneOf: [{ $ref: "#/components/schemas/StudyScore" }, { type: "null" }] }
        reviewSchedule: { type: array, items: { type: object, additionalProperties: true } }
        reportText: { type: ["string", "null"] }
        flashcards: { oneOf: [{ $ref: "#/components/schemas/StudyFlashcardDeck" }, { type: "null" }] }
    ExamGuide:
      type: object
      required: [found, examName, examCode, vendor, sections, sourceUrl, notes, fetchedAt]
      properties:
        found: { type: boolean }
        examName: { type: string }
        examCode: { type: string }
        vendor: { type: string }
        sections:
          type: array
          items:
            type: object
            required: [name, weight]
            properties:
              name: { type: string }
              weight: { type: ["number", "null"], description: "Percent of the exam, when the guide publishes it" }
        sourceUrl: { type: ["string", "null"] }
        notes: { type: string }
        fetchedAt: { type: string, format: date-time }
    FlashcardReviewInput:
      type: object
      required: [result]
      properties:
        result: { type: string, enum: [got, again] }
    StudyFlashcardDeck:
      type: object
      required: [cards, createdAt, completedAt]
      properties:
        createdAt: { type: string, format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        cards:
          type: array
          items:
            type: object
            required: [id, front, back, concept, results]
            properties:
              id: { type: string, format: uuid }
              front: { type: string }
              back: { type: string }
              concept: { type: string }
              results: { type: array, items: { type: string, enum: [got, again] } }
    StudyCheckIn:
      type: object
      required: [skipped]
      properties:
        skipped: { type: boolean }
    StudyCheckInResult:
      type: object
      required: [skipped, recordedAt]
      properties:
        skipped: { type: boolean }
        recordedAt: { type: string, format: date-time }
    StudyMessageInput:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 8000 }
    HomeChatInput:
      type: object
      required: [content, version]
      properties:
        content: { type: string, minLength: 1, maxLength: 8000 }
        version: { type: integer, minimum: 0, description: "Conversation version from the last GET/POST; 0 for a new conversation." }
        courseId: { type: string, maxLength: 200, description: "The course or exam the student is focused on: selects that course's thread (one per course; omitted or unknown = the general thread), and the coach assumes it when a message does not name one." }
    HomeChatOpenInput:
      type: object
      properties:
        courseId: { type: string, maxLength: 200, description: "The thread to open; omitted or unknown = the general thread." }
    HomeChatAction:
      type: object
      required: [type, courseId]
      properties:
        type: { type: string, enum: [create_course, start_quiz, start_flashcards, update_memory_sheet, start_session, lookup_exam_guide, web_search] }
        courseId: { type: string }
        found: { type: boolean, description: "lookup_exam_guide: an official guide was found (the course is now a certification exam)" }
        sections: { type: integer, description: "lookup_exam_guide: how many sections the guide has" }
        query: { type: string, description: "web_search: what was searched for" }
        name: { type: string, description: "create_course: the new course's name" }
        courseKind: { type: string, enum: [course, exam], description: "create_course: a college course or a certification exam" }
        rows:
          type: array
          description: "update_memory_sheet: the rows that were added"
          items:
            type: object
            required: [id, term, trick, whenYouSee, think]
            properties:
              id: { type: string }
              term: { type: string }
              trick: { type: string }
              whenYouSee: { type: string }
              think: { type: string }
        examDate: { type: string, description: "create_course (exam): YYYY-MM-DD when the student gave a date" }
        sessionId: { type: string, format: uuid, description: "start_quiz / start_session: the study session holding the set / conversation" }
        topic: { type: string }
        kind: { type: string, enum: [practice, exam], description: "start_quiz: practice reveals feedback per answer; exam only after grading" }
        count: { type: integer, minimum: 1, maximum: 50, description: "start_quiz: questions in the set; start_flashcards: cards in the deck" }
    HomeChatActiveDeck:
      type: object
      description: The flashcard deck most recently started from this chat, while it is unfinished. Cards come from GET /study/sessions/{sessionId}.
      required: [sessionId, courseId, topic, done, total]
      properties:
        sessionId: { type: string, format: uuid }
        courseId: { type: string }
        topic: { type: string }
        done: { type: integer }
        total: { type: integer }
    HomeChatActiveQuiz:
      type: object
      description: The question set most recently started from this chat, while it is still ungraded. Questions come from GET /study/sessions/{sessionId}.
      required: [sessionId, courseId, topic, kind, answered, total]
      properties:
        sessionId: { type: string, format: uuid }
        courseId: { type: string }
        topic: { type: string }
        kind: { type: string, enum: [practice, exam] }
        answered: { type: integer }
        total: { type: integer }
    HomeChatMessage:
      type: object
      required: [id, role, content, at]
      properties:
        id: { type: string }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        at: { type: string, format: date-time }
        actions: { type: array, items: { $ref: "#/components/schemas/HomeChatAction" } }
        suggestions: { type: array, items: { type: string }, description: "Tap-to-reply chips under an assistant message" }
        sessionStart: { type: boolean, description: "True for the app-written greeting that opens a new study session (clients draw a divider above it)" }
    HomeChat:
      type: object
      required: [messages, version]
      properties:
        messages: { type: array, items: { $ref: "#/components/schemas/HomeChatMessage" } }
        version: { type: integer }
        activeQuiz: { oneOf: [{ $ref: "#/components/schemas/HomeChatActiveQuiz" }, { type: "null" }] }
        activeDeck: { oneOf: [{ $ref: "#/components/schemas/HomeChatActiveDeck" }, { type: "null" }] }
    StudySourceStatus:
      type: object
      required: [usedSourceMaterial, selectedChunks, availableChunks, truncated, coverage, sources]
      properties:
        usedSourceMaterial: { type: boolean }
        selectedChunks: { type: integer }
        availableChunks: { type: integer }
        truncated: { type: boolean }
        coverage: { type: string, enum: [complete, selected, none] }
        sources:
          type: array
          items:
            type: object
            required: [label, kind]
            properties:
              label: { type: string }
              kind: { type: string, enum: [source, supplemental, inferred] }
    StudyQuizInput:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [diagnostic, targeted] }
    StudyQuizGenerationError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        expectedCount: { type: integer }
        invalidItemCount: { type: integer }
    StudyAnswerInput:
      type: object
      required: [questionId, optionId, assisted]
      properties:
        questionId: { type: string, format: uuid }
        optionId: { type: string, format: uuid }
        assisted: { type: boolean }
    StudyQuiz:
      type: object
      required: [mode, expectedCount, invalidItemCount, qualityNotice, questions, sourceStatus]
      properties:
        mode: { type: string, enum: [diagnostic, targeted] }
        kind: { type: string, enum: [practice, exam], description: "Chat-first sets only. Practice: feedback appears on each answered question before grading." }
        expectedCount: { type: integer, minimum: 1 }
        invalidItemCount: { type: integer, minimum: 0 }
        qualityNotice:
          type: string
          description: Transparent notice that automated AI checks do not guarantee factual correctness and learners can report invalid or ambiguous questions before grading.
        sourceStatus: { $ref: "#/components/schemas/StudySourceStatus" }
        questions:
          type: array
          items:
            type: object
            required: [id, prompt, concept, options, flag]
            properties:
              id: { type: string, format: uuid }
              prompt: { type: string }
              concept: { type: string }
              options:
                type: array
                items:
                  type: object
                  required: [id, text]
                  properties:
                    id: { type: string, format: uuid }
                    text: { type: string }
              flag:
                oneOf:
                  - $ref: "#/components/schemas/StudyQuestionFlag"
                  - { type: "null" }
              answer:
                oneOf:
                  - { type: object, required: [optionId, assisted], properties: { optionId: { type: string, format: uuid }, assisted: { type: boolean } } }
                  - { type: "null" }
              feedback:
                description: Available after this attempt has been graded, or, in a practice set, as soon as the question is answered.
                oneOf:
                  - $ref: "#/components/schemas/StudyQuestionFeedback"
                  - { type: "null" }
        grade: { oneOf: [{ $ref: "#/components/schemas/StudyScore" }, { type: "null" }] }
    StudyQuestionFlagInput:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [invalid, ambiguous, wrong_answer], description: "wrong_answer: the learner says the keyed answer is wrong; ambiguous: the question is unclear; invalid: legacy" }
        reason: { type: string, minLength: 1, maxLength: 500 }
    StudyQuestionFlag:
      type: object
      required: [kind, reason, reportedAt]
      properties:
        kind: { type: string, enum: [invalid, ambiguous, wrong_answer] }
        reason: { type: ["string", "null"], maxLength: 500 }
        reportedAt: { type: string, format: date-time }
        recheck:
          description: Independent re-check of the keyed answer, run when the question was reported. Absent when the check could not run (the question is then excluded).
          oneOf:
            - $ref: "#/components/schemas/StudyQuestionRecheck"
            - { type: "null" }
    StudyQuestionRecheck:
      type: object
      required: [verdict, explanation, checkedAt]
      properties:
        verdict: { type: string, enum: [key_holds, key_wrong, unclear], description: "key_holds: the key is confirmed and the question still counts; key_wrong: the checker picked another option, the question no longer counts; unclear: two options are defensible, the question no longer counts" }
        correctOptionId: { type: string, format: uuid, description: "The checker's answer when the key was wrong" }
        correctOptionText: { type: string }
        explanation: { type: string, description: "Two or three plain sentences for the learner" }
        checkedAt: { type: string, format: date-time }
    StudyQuestionFeedback:
      type: object
      required: [selectedOptionId, selectedOptionText, correctOptionId, correctOptionText, explanation, concept, assisted]
      properties:
        hook: { type: string, description: "One-line memory trick for this question (shown when missed)" }
        selectedOptionId: { type: ["string", "null"], format: uuid }
        selectedOptionText: { type: ["string", "null"] }
        correctOptionId: { type: string, format: uuid }
        correctOptionText: { type: string }
        explanation: { type: string }
        concept: { type: string }
        assisted: { type: boolean }
    StudyScore:
      type: object
      description: Invalid item count includes AI-rejected items and learner-flagged invalid or ambiguous questions reported before grading.
      required: [correct, answered, excluded, invalidItems, unanswered, total, percent, gradedAt]
      properties:
        correct: { type: integer }
        answered: { type: integer }
        excluded: { type: integer }
        invalidItems: { type: integer }
        unanswered: { type: integer }
        total: { type: integer }
        percent: { type: number }
        gradedAt: { type: string, format: date-time }
    AnalyzeInput:
      type: object
      required: [course, filename, text]
      properties:
        course: { type: string }
        filename: { type: string }
        text: { type: string }
    AnalyzeResult:
      type: object
      required: [topics, deadlines]
      properties:
        topics:
          type: array
          items: { type: string }
        deadlines:
          type: array
          items:
            $ref: "#/components/schemas/Deadline"
    Deadline:
      type: object
      required: [title, date, kind]
      properties:
        title: { type: string }
        date: { type: string, description: YYYY-MM-DD }
        kind: { type: string, enum: [exam, assignment] }
    QuizInput:
      type: object
      required: [course, topic, count, materials]
      properties:
        course: { type: string }
        topic: { type: string }
        count: { type: integer, enum: [10, 20] }
        materials: { type: string }
        sources:
          type: array
          items:
            $ref: "#/components/schemas/QuizSource"
        weakConcepts:
          type: array
          items: { type: string }
        mode: { type: string, enum: [standard, targeted, cumulative] }
    QuizSource:
      type: object
      required: [id, label, text]
      properties:
        id: { type: string }
        label: { type: string }
        text: { type: string }
    SourceReference:
      type: object
      required: [id, excerpt]
      properties:
        id: { type: string }
        excerpt: { type: string }
    TranscriptResult:
      type: object
      required: [segments]
      properties:
        segments:
          type: array
          items:
            type: object
            required: [start, end, text]
            properties:
              start: { type: number }
              end: { type: number }
              text: { type: string }
    LectureSegment:
      type: object
      required: [start, end, text]
      properties:
        start: { type: number, minimum: 0 }
        end: { type: number, minimum: 0 }
        text: { type: string, maxLength: 20000 }
    LectureStatus:
      type: string
      enum: [recorded, transcribed, reviewed]
      description: recorded = audio only on the device; transcribed = AI transcript not yet reviewed; reviewed = student-approved transcript, used as course material
    LectureInput:
      type: object
      required: [courseId, title, recordedAt, durationSeconds]
      properties:
        courseId: { type: string, minLength: 1, maxLength: 200 }
        title: { type: string, minLength: 1, maxLength: 200 }
        recordedAt: { type: string, format: date-time }
        durationSeconds: { type: integer, minimum: 1, maximum: 14400 }
    LectureUpdate:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: "#/components/schemas/LectureStatus" }
        segments:
          type: array
          maxItems: 2000
          items: { $ref: "#/components/schemas/LectureSegment" }
    LectureSummary:
      type: object
      required: [id, courseId, title, recordedAt, durationSeconds, status, segmentCount, version, updatedAt]
      properties:
        id: { type: string, format: uuid }
        courseId: { type: string }
        title: { type: string }
        recordedAt: { type: string, format: date-time }
        durationSeconds: { type: integer }
        status: { $ref: "#/components/schemas/LectureStatus" }
        segmentCount: { type: integer }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
    Lecture:
      allOf:
        - { $ref: "#/components/schemas/LectureSummary" }
        - type: object
          required: [segments]
          properties:
            segments:
              type: array
              items: { $ref: "#/components/schemas/LectureSegment" }
    QuizResult:
      type: object
      required: [questions]
      properties:
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Question"
    Question:
      type: object
      required: [prompt, options, answerIndex, concept, explanation, mnemonic, teaching, distractors]
      properties:
        prompt: { type: string }
        options:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: string }
        answerIndex: { type: integer, minimum: 0, maximum: 3 }
        concept: { type: string }
        explanation: { type: string }
        mnemonic: { type: string }
        teaching: { type: string }
        distractors:
          type: array
          minItems: 4
          maxItems: 4
          description: Why each option is right or wrong, used to classify a missed answer
          items:
            type: object
            required: [reason, errorType]
            properties:
              reason: { type: string }
              errorType: { type: string, enum: [knowledge, conceptual, application, question-reading] }
        sourceRefs:
          type: array
          items:
            $ref: "#/components/schemas/SourceReference"
    PlanInput:
      type: object
      required: [course, examTitle, examDate, topics, materials]
      properties:
        course: { type: string }
        examTitle: { type: string }
        examDate: { type: string }
        topics:
          type: array
          items: { type: string }
        materials: { type: string }
        weakConcepts:
          type: array
          items: { type: string }
        minutesPerDay: { type: integer }
        scheduleConstraints: { type: string }
    PlanResult:
      type: object
      required: [days]
      properties:
        days:
          type: array
          items:
            type: object
            required: [date, phase, focus, task]
            properties:
              date: { type: string }
              phase: { type: string }
              focus: { type: string }
              task: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
