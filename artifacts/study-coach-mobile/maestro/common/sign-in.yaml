# Signs out of whatever account the simulator holds, then signs in as the test account.
# The test account's email has +clerk_test, so any emailed code is 424242 (Clerk test mode).
appId: com.danfrancis.studycoach.dev
---
- runFlow: open-app.yaml
# A sign-in left half-done reopens on the code step: finish it (the test account's code is always 424242).
- runFlow:
    when:
      visible: "Email verification code"
    commands:
      - tapOn: "Enter code"
      - inputText: "424242"
      - tapOn: "Verify and sign in"
      - extendedWaitUntil:
          visible: "Account"
          timeout: 30000
- runFlow:
    when:
      visible: "Account"
    commands:
      - tapOn: "Account"
      - scrollUntilVisible:
          element:
            id: "button-sign-out"
      - tapOn:
          id: "button-sign-out"
# The intro video and the tour play before every sign-in (D-152).
- extendedWaitUntil:
    visible:
      id: "button-intro-skip|button-onboarding-skip|button-onboarding-next|screen-sign-in"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "button-intro-skip"
    commands:
      - tapOn:
          id: "button-intro-skip"
# The tour: page 1 has only "Agree and continue"; later pages have Skip; the last page has only its button.
- repeat:
    times: 7
    while:
      notVisible:
        id: "screen-sign-in"
    commands:
      - runFlow:
          when:
            visible:
              id: "button-onboarding-skip"
          commands:
            - tapOn:
                id: "button-onboarding-skip"
      - runFlow:
          when:
            visible:
              id: "button-onboarding-next"
          commands:
            - tapOn:
                id: "button-onboarding-next"
- extendedWaitUntil:
    visible:
      id: "screen-sign-in"
    timeout: 20000
- takeScreenshot: 01-sign-in-screen
# Clerk keeps a half-done sign-in: the screen can open on the code step. Start over so email and password are typed fresh.
- runFlow:
    when:
      visible: "Email verification code"
    commands:
      - tapOn: "Start over"
      - extendedWaitUntil:
          visible:
            id: "input-sign-in-email"
          timeout: 10000
- tapOn:
    id: "input-sign-in-email"
- eraseText: 60
- inputText: ${MAESTRO_EMAIL}
- tapOn:
    id: "input-sign-in-password"
- eraseText: 40
- inputText: ${MAESTRO_PASSWORD}
# The keyboard covers the button: scroll the page up until the button is clear of it.
- repeat:
    times: 3
    commands:
      - swipe:
          start: 50%, 40%
          end: 50%, 15%
          duration: 400
- tapOn:
    id: "button-sign-in-submit"
# iOS offers to save the password; it covers the screen.
- extendedWaitUntil:
    visible: "Not Now|Account"
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- runFlow:
    when:
      visible: "Email verification code"
    commands:
      - tapOn: "Enter code"
      - inputText: "424242"
      - tapOn: "Verify and sign in"
# Signed in: the tab bar is on screen.
- extendedWaitUntil:
    visible: "Account"
    timeout: 30000
