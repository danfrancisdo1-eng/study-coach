<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <meta name="theme-color" content="#283449"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <meta name="apple-mobile-web-app-title" content="RapidRecall AI"/>
    <meta name="description" content="A focused study companion, grounded in your courses and your own material."/>
    <link rel="manifest" href="/manifest.webmanifest"/>
    <link rel="icon" href="/app-icon-64.png" type="image/png"/>
    <link rel="apple-touch-icon" href="/app-icon-192.png"/>
    <title>RapidRecall AI — your next good study session</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // Development previews must not reuse an older installed offline bundle.
      if (import.meta.env.DEV && 'serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        if (registrations.length) {
          await Promise.all(registrations.map(registration => registration.unregister()));
          if (navigator.serviceWorker.controller) {
            location.reload();
          } else {
            await import('./src/main.tsx');
          }
        } else {
          await import('./src/main.tsx');
        }
      } else {
        await import('./src/main.tsx');
      }
    </script>
  </body>
</html>
